# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/admin-by-request/suspicious_application_elevated_install_detected.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: 2cf324dd-50f8-43a5-a2d5-9a180d8dec31
name: Admin By Request — Suspicious Elevated Application Install
description: Approved PEDM elevation sessions used to install tooling commonly abused for remote access
  (rustdesk/anydesk/teamviewer/vnc), tunneling (ngrok/zerotier/tailscale), credential harvesting (lazagne/nirsoft
  password viewers), or unsanctioned cloud sync/ exfil (dropbox/megasync/rclone). Tiered into High/Medium/Low
  risk based on tool category; installs from temp/appdata with no vendor metadata are also flagged regardless
  of tool identity.
severity: Medium
status: Available
enabled: true
queryFile: suspicious-application-elevated-install-detected.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- Exfiltration
relevantTechniques:
- T1219
- T1572
- T1555
- T1567
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name/UPN
    columnName: User/UserAccount/UserEmail
- entityType: Host
  fieldMappings:
  - identifier: Name
    columnName: Computer
- entityType: File
  fieldMappings:
  - identifier: Name/Hash
    columnName: AppName/AppFile, SHA256
