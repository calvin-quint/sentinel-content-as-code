  durable, MFA-independent access to mail/files without ever touching the user's password.
severity: Medium
status: Available
enabled: true
queryFile: app-consent-activity.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- InitialAccess
- Persistence
relevantTechniques:
- T1528
- T1098.001
