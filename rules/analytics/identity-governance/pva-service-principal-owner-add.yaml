id: 9dc086d2-c0e7-4b6b-8e95-19171b6a4d5a
name: Power Virtual Agents Adding Service Principal Owner
description: A service principal ownership change initiated by Power Virtual Agents specifically — an
  unusual actor for this operation. Owning a service principal grants control over its credentials and
  permissions, so a Power Platform bot/flow granting itself or another principal ownership is a plausible
  privilege-escalation path via low-code automation that's easy to overlook.
severity: Medium
status: Available
enabled: true
queryFile: pva-service-principal-owner-add.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- Persistence
- PrivilegeEscalation
relevantTechniques:
- T1098.003
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: UPN
    columnName: userPrincipalName
