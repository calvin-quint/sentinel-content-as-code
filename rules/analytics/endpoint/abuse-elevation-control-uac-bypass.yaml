# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
id: 1e8e5cdc-d6b9-4604-bc95-44fdb2d6c593
name: Abuse Elevation Control Mechanism - UAC Bypass
description: |
  Detects the classic UAC bypass pattern abusing Windows binaries that auto-elevate
  without a consent prompt (fodhelper, eventvwr, computerdefaults, sdclt, slui, cmstp,
  wsreset). Two-stage detection: (1) a registry write to the hijack paths these
  binaries read from before elevating, followed by (2) the auto-elevate binary itself
  spawning an unexpected child process (a shell) - which it never legitimately does on
  its own. Either signal alone is weak; the pair together is high-fidelity.

  False positives: rare for the correlated version. The registry-only stage can fire
  on legitimate settings troubleshooting; require the process-spawn correlation
  before alerting, don't act on Stage 1 alone.
severity: High
status: Available
enabled: true
queryFile: abuse-elevation-control-uac-bypass.kql
queryFrequency: PT1H
queryPeriod: P1D
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
  - PrivilegeEscalation
  - DefenseEvasion
relevantTechniques:
  - T1548.002
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: Name
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
eventGroupingSettings:
  aggregationKind: SingleAlert
