# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/endpoint/suspicious_browser_installs.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: 302a49ad-401e-4915-816e-bb623062d770
name: Suspicious/Unwanted Browser Installs
description: File creation or execution of known PUA-adjacent alternative browsers/launchers (Wave Browser,
  Shift, OneLaunch, generic Chromium repacks) over a 14-day window. These are typically bundled with free-download
  installers and used for ad injection, search hijacking, or as a foothold for follow-on adware — uncommon
  on managed endpoints and worth removal + user follow-up.
severity: Medium
status: Available
enabled: true
queryFile: suspicious-browser-installs.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- Execution
relevantTechniques:
- T1204.002
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: Name
    columnName: DeviceName
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: InitiatingProcessAccountName
- entityType: File
  fieldMappings:
  - identifier: Hash
    columnName: SHA1/SHA256
