# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
id: 768df6e3-e68c-4ba8-a358-bc693b069652
name: Suspicious Browser Extension Installation
description: |
  Detects the common malicious browser-extension install vectors - sideloading an
  unpacked extension via command-line flags (bypasses Chrome/Edge Web Store review
  entirely), forced-install via registry policy keys written outside the normal
  Intune/GPO management context, and extension files dropped into browser profile
  directories by a non-browser parent process. Any one of these alone can be
  legitimate; the combination of vector + non-standard actor is the actual signal.

  False positives: legitimate enterprise extension deployment via Intune (will show
  as SYSTEM/mdm-managed writes - exclude known Intune push accounts/processes below).
  Developers intentionally using --load-extension for local testing.
severity: High
status: Available
enabled: true
queryFile: browser-extension-suspicious-install.kql
queryFrequency: PT1H
queryPeriod: P1D
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
  - Persistence
relevantTechniques:
  - T1176
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: Name
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
eventGroupingSettings:
  aggregationKind: SingleAlert
