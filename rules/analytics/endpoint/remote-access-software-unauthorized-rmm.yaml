# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
id: 5b85efba-0f07-4c36-a730-31351cee33d4
name: Remote Access Software - Unauthorized RMM Tool Detection
description: |
  Flags installation or execution of remote monitoring & management tools that are
  not the sanctioned RMM stack (Atera). RMM abuse has become one of the most common
  payload types in 2026 threat reporting - attackers favor it over custom malware
  because the binaries are signed, commonly whitelisted, and rarely trigger AV on
  their own. This rule matches a curated list of known RMM tool binary/process names
  and excludes the approved Atera footprint.

  False positives: a help-desk tech legitimately using a customer's RMM tool during a
  vendor support session; contractors/MSPs using their own approved tooling. Maintain
  the ApprovedRMMTools watchlist and route confirmed-legit hits through a suppression
  rule rather than deleting them from the base detection list.

  Watchlist required (optional but recommended): "ApprovedRMMTools" - column
  ProcessName, seeded with Atera's actual binary/service names so exceptions are
  managed centrally instead of edited into this query.
severity: High
status: Available
enabled: true
queryFile: remote-access-software-unauthorized-rmm.kql
queryFrequency: PT1H
queryPeriod: P1D
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
  - CommandAndControl
relevantTechniques:
  - T1219
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: Name
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
  - entityType: File
    fieldMappings:
      - identifier: Name
        columnName: FileName
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
eventGroupingSettings:
  aggregationKind: SingleAlert
