# Imported from calvin-quint/docs: 01-detection-engineering/kql/1password/emergency_glass_break_account_successful_authentication.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: a3ef6edd-5afd-4e6c-81f3-330e000ba067
name: 1Password Break-Glass Account Successful Authentication
description: Any successful authentication to the emergency break-glass admin account. This account exists
  solely for outage/lockout recovery and should never be used in normal operations — any hit here is a
  same-day investigation, not a tuning candidate.
severity: Medium
status: Available
enabled: true
queryFile: emergency-glass-break-account-successful-authentication.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- InitialAccess
- PrivilegeEscalation
relevantTechniques:
- T1078.004
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: UPN
    columnName: target_user.email
