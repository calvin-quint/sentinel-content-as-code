# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
id: d3cd4ded-31ca-4fd6-93ec-0330b34eede8
name: Newly Registered / First-Seen Domain Detection
description: |
  Flags domains queried by the environment that have no query history in the prior
  30-day baseline window - a practical proxy for "newly registered/newly seen" without
  requiring a WHOIS/RDAP feed. Pair with Microsoft Defender TI or a commercial NRD feed
  via ThreatIntelligenceIndicator if available for true registration-date fidelity.

  Data source: ASIM DNS normalization (_Im_Dns) - source-agnostic, works against
  Cloudflare Gateway logs, Windows DNS analytics, or any connector mapped to the ASIM
  DNS schema. Swap _Im_Dns for the actual table (e.g. CommonSecurityLog,
  DeviceNetworkEvents) if ASIM parsers aren't deployed in the workspace.

  False positives: legitimately new SaaS vendors, CDN edge nodes.

  Companion rule: see lookalike-domain-detected.yaml for the brand-typosquat detection
  that was originally the second half of this hunting query - split out because a
  Sentinel scheduled rule can only emit one query result and the two detections use
  unrelated logic and severities.
severity: Medium
status: Available
enabled: true
queryFile: newly-registered-domain-first-seen.kql
queryFrequency: PT1H
queryPeriod: P1D
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
  - ResourceDevelopment
relevantTechniques:
  - T1583.001
  - T1584.001
entityMappings:
  - entityType: DNS
    fieldMappings:
      - identifier: DomainName
        columnName: DnsQuery
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
eventGroupingSettings:
  aggregationKind: SingleAlert
