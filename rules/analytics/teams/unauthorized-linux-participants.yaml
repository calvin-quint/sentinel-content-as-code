# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/teams/unauthorized_linux_participants.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: 7cca4dab-452b-4489-a774-59a4295abdf4
name: Unauthenticated Linux Participants in Teams Meetings
description: Near-real-time (15-minute window) Teams meetings where `HasUnauthenticatedUsers` is true
  and a participant's client OS is Linux — an unauthenticated join from a Linux fingerprint is consistent
  with a scripted/bot participant slipping in via a shared meeting link rather than a genuine guest attendee.
severity: Medium
status: Available
enabled: true
queryFile: unauthorized-linux-participants.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- Collection
- InitialAccess
relevantTechniques:
- T1119
- T1199
