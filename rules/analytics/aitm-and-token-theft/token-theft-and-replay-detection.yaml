# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/aitm-and-token-theft/Token Theft and Replay Detection.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: 9aa10d60-2f52-494c-a1e3-b989e57f186e
name: Token Theft and Replay Detection (production/current version)
description: High-risk sign-ins where the MFA requirement was satisfied by a previously-issued token claim
  (not a fresh MFA prompt) rather than by no incoming token, self-joined against the same user's immediately
  prior sign-in to compute impossible country/state/ city travel between the two. Broadens the trigger
  from a strict AND to an OR across three paths (claim-satisfied, previously- satisfied, or approved mobile
  push) so it catches variants the earlier archived versions missed — see versions/ for lineage.
severity: Medium
status: Available
enabled: true
queryFile: token-theft-and-replay-detection.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- CredentialAccess
- DefenseEvasion
- Persistence
relevantTechniques:
- T1539
- T1550.004
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: UPN
    columnName: UserPrincipalName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: IPAddress
