# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
id: 9a482c18-acf5-43c0-a532-a67c492ac4f1
name: Steal Application Access Token - OAuth Consent Phishing
description: |
  Detects the "illicit consent grant" attack - a user is phished into granting a
  malicious (or malicious-looking) OAuth app permissions to their mailbox/files/
  directory without any password ever being stolen. The app then holds a standing
  token and doesn't need to re-authenticate, making this persistent and
  MFA-bypassing by design. Three-part detection: (1) user consent grants requesting
  high-risk scopes, (2) apps with red-flag registration characteristics (unverified
  publisher, multi-tenant, newly created), and (3) correlated risk scoring based on
  app age at consent.

  False positives: legitimate SaaS onboarding (users self-service-consenting to real
  business tools like Zoom, Slack, Calendly connectors). Tune the highRiskScopes list
  to the actual risk tolerance, and maintain an ApprovedOAuthApps watchlist for
  known-good recurring apps.
severity: High
status: Available
enabled: true
queryFile: steal-application-access-token-oauth-consent.kql
queryFrequency: PT1H
queryPeriod: P1D
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
  - CredentialAccess
relevantTechniques:
  - T1528
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: UPN
        columnName: GrantedBy
  - entityType: CloudApplication
    fieldMappings:
      - identifier: Name
        columnName: AppDisplayName
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
eventGroupingSettings:
  aggregationKind: SingleAlert
