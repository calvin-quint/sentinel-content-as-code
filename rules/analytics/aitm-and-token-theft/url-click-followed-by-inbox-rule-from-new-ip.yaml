# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/aitm-and-token-theft/url_click_followed_by_inbox_rule_from_new_ip.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: 19b92e2d-6b87-4dbf-a8ed-06d72fdaadc1
name: URL Click Followed by Inbox Rule Creation From a New IP
description: 'A tracked URL click followed within 60 minutes by that user creating/modifying an inbox
  rule, where the rule-creation IP differs from the click IP, is absent from a prior 14-day IP baseline,
  and isn''t on the TrustedIPs watchlist. This is the post-AiTM-phish persistence step: the attacker rides
  the stolen session to plant a forwarding/hiding rule from their own infrastructure, moments after the
  victim clicked the lure.'
severity: Medium
status: Available
enabled: true
queryFile: url-click-followed-by-inbox-rule-from-new-ip.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- InitialAccess
- Collection
relevantTechniques:
- T1566.002
- T1114.003
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: UPN
    columnName: UPN
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: ClickIPAddress / RuleIPAddress
