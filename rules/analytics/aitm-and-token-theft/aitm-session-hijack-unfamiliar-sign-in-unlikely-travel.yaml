# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/aitm-and-token-theft/AiTM Session Hijack – Unfamiliar Sign-in + Unlikely Travel.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: af9f8abf-5b36-4f55-a050-f397a4dbe85a
name: AiTM Session Hijack — Unfamiliar Sign-in + Unlikely Travel
description: A user triggering both an "unfamiliarFeatures" risk event and an "unlikelyTravel" risk event
  within 60 minutes of each other — the classic pairing left behind by an adversary-in-the-middle session
  hijack, where the victim signs in normally and the attacker replays the stolen session from a geographically
  implausible location minutes later.
severity: Medium
status: Available
enabled: true
queryFile: aitm-session-hijack-unfamiliar-sign-in-unlikely-travel.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- CredentialAccess
- InitialAccess
relevantTechniques:
- T1539
- T1078.004
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: UPN
    columnName: UserPrincipalName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: UnfamiliarIP / TravelIP
