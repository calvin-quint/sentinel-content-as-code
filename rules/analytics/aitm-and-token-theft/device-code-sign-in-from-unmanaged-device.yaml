# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/aitm-and-token-theft/Device Code Sign-In From Unmanaged Device.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: 203f5b01-8387-407b-9943-7ccf188e0b2e
name: Device Code Sign-In From Unmanaged Device (real-time, IP-baselined)
description: Real-time (1-hour lookback) device-code sign-ins from an untrusted network location where
  the device trust type is empty or "Unmanaged," enriched against a 14-day per-user IP baseline to flag
  whether the source IP is new. Tighter, near-real-time sibling of the noncompliant/unmanaged device-code
  rule — built for fast triage rather than historical hunting.
severity: Medium
status: Available
enabled: true
queryFile: device-code-sign-in-from-unmanaged-device.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- CredentialAccess
relevantTechniques:
- T1528
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: UPN
    columnName: UserPrincipalName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: IPAddress
