# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/aitm-and-token-theft/url_click_followed_by_device_code_authentication.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: 4b3b8c64-35eb-44a1-b5df-94e3be4fc957
name: URL Click Followed by Device Code Authentication
description: A Safe Links-tracked URL click by a user followed within 15 minutes by that same user completing
  a device-code-flow sign-in — the exact sequence of a device-code phishing attack, where the clicked
  link leads to a lure instructing the victim to enter an attacker-generated device code, handing the
  attacker a live session token with no password or MFA prompt of their own.
severity: Medium
status: Available
enabled: true
queryFile: url-click-followed-by-device-code-authentication.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- InitialAccess
- CredentialAccess
relevantTechniques:
- T1566.002
- T1528
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: UPN
    columnName: AccountUpn / UserPrincipalName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: IPAddress / SigninIP
