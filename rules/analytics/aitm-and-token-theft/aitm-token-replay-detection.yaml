# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/aitm-and-token-theft/AiTM Token Replay Detection.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: 058afb46-37ad-4f55-9927-01f0c337a10c
name: AiTM Token Replay Detection (production/current version)
description: 'The same session/refresh token (UniqueTokenIdentifier) used across multiple IPs or countries
  within a 30-day window, weighted by a composite SignalScore that rewards MFA-bypassed sign-ins, primary
  refresh token (PRT) usage, explicit token-replay result codes, and IPs/countries never seen for that
  user in a 14/90-day baseline. This is the highest-fidelity signal for AiTM (Evilginx-style) session
  cookie theft: the token itself, not just the account, is being reused from attacker infrastructure.'
severity: Medium
status: Available
enabled: true
queryFile: aitm-token-replay-detection.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- CredentialAccess
- DefenseEvasion
- Persistence
relevantTechniques:
- T1539
- T1550.004
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: UPN
    columnName: UserPrincipalName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: TokenIPs / IPs
