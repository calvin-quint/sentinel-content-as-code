# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/identity/password_success_from_unmanaged_device_unfamiliar_features.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: 43bd0010-93a0-4afd-a61c-0a5dad31d238
name: Successful Password Sign-in from Unmanaged Device with Unfamiliar Features
description: A correct-password sign-in that succeeds from a device with no Entra device ID (unmanaged/BYOD)
  while Identity Protection flags "unfamiliarFeatures" risk — an atypical browser/device/location combination
  for that user. Combination of unmanaged endpoint + anomalous signal is a strong indicator of credential
  compromise rather than routine BYOD use.
severity: Medium
status: Available
enabled: true
queryFile: password-success-from-unmanaged-device-unfamiliar-features.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- InitialAccess
relevantTechniques:
- T1078.004
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: UPN
    columnName: UserPrincipalName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: IPAddress
