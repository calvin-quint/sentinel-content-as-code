# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/identity/failed_passwordless_mfa.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: e1405ded-1520-42b9-8c86-2def9337845a
name: Failed Passwordless/Phishing-Resistant MFA Step
description: A failed authentication step against a phishing-resistant method (FIDO2, Windows Hello, Passkey,
  Temporary Access Pass, Phone App Notification). Legitimate users rarely fail these repeatedly — failures
  usually mean an attacker with a stolen password hitting a hardware/biometric barrier they can't satisfy,
  or a misconfigured registration worth a support follow-up.
severity: Medium
status: Available
enabled: true
queryFile: failed-passwordless-mfa.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- CredentialAccess
relevantTechniques:
- T1621
- T1110
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: UPN
    columnName: UserPrincipalName
