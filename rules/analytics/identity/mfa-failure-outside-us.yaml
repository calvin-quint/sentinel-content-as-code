# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/identity/mfa_failure_outside_us.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: d3116762-c4ee-444f-83f2-b74af4dbd01f
name: MFA Failure Outside the US (Correct Password)
description: Any failed MFA step following a correct password, sourced from outside the US. Broader companion
  to the mobile-push-specific rule — catches failures across all MFA method types, flagging attackers
  who've obtained valid passwords but can't clear the second factor from unfamiliar geography.
severity: Medium
status: Available
enabled: true
queryFile: mfa-failure-outside-us.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- CredentialAccess
- InitialAccess
relevantTechniques:
- T1621
- T1078
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: UPN
    columnName: UserPrincipalName
