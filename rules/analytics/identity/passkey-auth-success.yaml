# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/identity/passkey_auth_success.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: 22541135-9e00-40d7-95cc-c016d4830ff6
name: Successful Passkey Authentication
description: All sign-ins where a passkey authentication step succeeded. Used to track passwordless/passkey
  rollout adoption across the tenant rather than to flag malicious activity.
severity: Medium
status: Available
enabled: true
queryFile: passkey-auth-success.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: UPN
    columnName: UserPrincipalName
