# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/identity/failed_conditional_access_signins.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: fda9dcd1-5269-4154-993e-6d4d614ace85
name: Failed Conditional Access Sign-ins on Risky Accounts
description: Sign-ins blocked by Conditional Access (password-change-required, strong-auth-required, or
  missing session info) where the account was already flagged medium/high risk during sign-in. Surfaces
  credential-compromise attempts that CA is currently absorbing — worth a proactive password reset/session
  revoke rather than waiting for a successful bypass.
severity: Medium
status: Available
enabled: true
queryFile: failed-conditional-access-signins.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- InitialAccess
relevantTechniques:
- T1078.004
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: UPN
    columnName: UserPrincipalName
