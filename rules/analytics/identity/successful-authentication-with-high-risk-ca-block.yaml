# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/identity/successful_authentication_with_high_risk_ca_block.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: 80c7cd14-7b7e-4534-bb22-2469aade3dbd
name: Successful Authentication Steps on a High-Risk, CA-Blocked Sign-in
description: Sign-ins where Conditional Access blocked the overall attempt (ResultType 53003, high risk)
  but the underlying authentication step(s) — password/MFA — actually succeeded. This means the credentials/second
  factor were valid; CA is the only thing that stopped the sign-in, so these accounts warrant a credential
  reset even though no breach technically occurred.
severity: Medium
status: Available
enabled: true
queryFile: successful-authentication-with-high-risk-ca-block.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- InitialAccess
relevantTechniques:
- T1078.004
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: UPN
    columnName: UserPrincipalName
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: IPAddress
