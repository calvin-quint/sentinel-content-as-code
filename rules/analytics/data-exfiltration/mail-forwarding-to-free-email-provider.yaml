# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/data-exfiltration/mail_forwarding_to_free_email_provider.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: 75ebeacf-725e-4131-9964-f22e94cefbd7
name: Mail Forwarding to Free/Personal Email Provider
description: Mailbox forwarding or inbox-rule redirects whose destination domain matches a known consumer
  webmail provider (Gmail, Yahoo, Outlook.com, iCloud, ProtonMail, etc.). Narrower and higher- confidence
  than the general external-forwarding rule — forwarding to a personal inbox has essentially no legitimate
  business reason and is a common self-exfiltration or departing-employee pattern.
severity: Medium
status: Available
enabled: true
queryFile: mail-forwarding-to-free-email-provider.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- Collection
- Exfiltration
relevantTechniques:
- T1114.003
- T1567
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name/UPNSuffix
    columnName: AccountName/AccountUPNSuffix
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: ClientIPAddress
