# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/data-exfiltration/meeting_links_to_ai_services.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: bb62fe99-04af-41cc-83dd-a1e3c4adbeaa
name: Meeting Invite Links Sent to AI Transcription Services
description: Outbound emails containing a Teams/Zoom meeting join link where the recipient address belongs
  to an AI note-taking service (otter.ai, read.ai) — i.e. someone forwarding or CC'ing a meeting invite
  so the bot auto-joins. Email-based companion to the Teams-bot detections in the teams/ folder; catches
  the invite step rather than the bot's in-meeting activity.
severity: Medium
status: Available
enabled: true
queryFile: meeting-links-to-ai-services.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- Collection
- Exfiltration
relevantTechniques:
- T1119
- T1567
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Address
    columnName: SenderFromAddress
