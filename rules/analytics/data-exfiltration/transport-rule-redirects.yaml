# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/data-exfiltration/transport_rule_redirects.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: 557b06ce-187f-46d9-99fc-057c0f968932
name: Transport Rule BCC/Redirect Created or Modified
description: Org-wide Exchange transport rule creation/modification that adds a BlindCopyTo or RedirectMessageTo
  action. Transport rules apply at the tenant mail-flow level rather than a single mailbox, so a malicious
  or compromised-admin rule here silently BCCs or redirects mail across many/all users at once — a far
  larger blast radius than a personal inbox rule and typically requires Exchange admin privileges to create.
severity: Medium
status: Available
enabled: true
queryFile: transport-rule-redirects.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- Collection
relevantTechniques:
- T1114.003
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name/UPNSuffix
    columnName: Account_0_Name/Account_0_UPNSuffix
- entityType: IP
  fieldMappings:
  - identifier: Address
    columnName: IP_0_Address
