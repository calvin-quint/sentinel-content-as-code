# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
# Imported from calvin-quint/docs: 01-detection-engineering/kql/data-exfiltration/internal_mail_forwarding.kql
# NOTE: source had no explicit Severity/Frequency/Period header — defaulted to Medium/PT1H/PT1H, review before relying on it.
id: 661613d6-98cb-4adb-a5fd-cb06c653b8c6
name: Mail Forwarding Rule Classification (Internal vs. External)
description: Every inbox rule with a "Forward" action, parsed out of the raw Exchange audit event, and
  labels each by whether the recipient's domain matches the sender's own domain. Baseline/triage query
  — use the "Forward to External" rows as the actionable subset and "Forward to Internal" as expected
  noise.
severity: Medium
status: Available
enabled: true
queryFile: internal-mail-forwarding.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
- Collection
relevantTechniques:
- T1114.003
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: UPN
    columnName: UserIdClean
