# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
id: cb7454b5-60d1-4b8b-9efa-12b590e26c48
name: Indicator Removal - Windows Event Log Cleared
description: |
  Detects command-line invocation of the classic Windows event-log-clearing
  utilities/cmdlets - wevtutil cl / clear-log, PowerShell Clear-EventLog /
  Remove-EventLog, and the "wmic ntevent" clear path. Nearly always a deliberate
  anti-forensics step taken immediately after an intrusion to erase evidence, rarely
  a routine admin action outside scheduled log rotation.

  This rule detects via MDE command-line telemetry alone. If the workspace also
  ingests the SecurityEvent table (via AMA or the legacy Log Analytics agent), pair
  this with a native Event 1102 ("The audit log was cleared") rule for a
  higher-fidelity, harder-to-evade signal - see the commented-out fallback query in
  the sibling .kql file.

  False positives: scheduled log-rotation/maintenance scripts, or backup/imaging
  processes that clear logs on a golden-image template before capture. Exclude known
  maintenance windows/service accounts.
severity: High
status: Available
enabled: true
queryFile: indicator-removal-event-log-clear.kql
queryFrequency: PT1H
queryPeriod: P1D
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1070.001
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: Name
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
eventGroupingSettings:
  aggregationKind: SingleAlert
