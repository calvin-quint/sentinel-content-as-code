# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
id: 10232763-90dc-4051-804e-efc07283ce7a
name: Impair Defenses - EDR/AV Tamper Attempt
description: |
  Detects attempts to disable, stop, or weaken Microsoft Defender/EDR protections -
  service stops, PowerShell cmdlets disabling real-time protection or adding broad
  scan exclusions, and registry writes to the Defender tamper-protection and policy
  keys. This directly threatens the detection pipeline itself, so treat any hit as
  high priority regardless of what else is happening on the host.

  False positives: legitimate security-tooling administration by the EDR/AV team
  pushing config changes via approved deployment tooling. Exclude the Intune/MDM
  management accounts and Defender configuration management service accounts.
severity: High
status: Available
enabled: true
queryFile: impair-defenses-edr-av-tamper.kql
queryFrequency: PT1H
queryPeriod: P1D
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1562.001
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: Name
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
eventGroupingSettings:
  aggregationKind: SingleAlert
