# yaml-language-server: $schema=../../../schemas/analytics-rule.schema.json
id: 4a45e6bf-152f-4c65-97ee-1f675b0192ff
name: Inhibit System Recovery - Shadow Copy / Backup Deletion (Ransomware Precursor)
description: |
  Detects command-line invocations that delete or disable Windows shadow copies,
  backups, and recovery options - the near-universal precursor step before ransomware
  detonation, executed to prevent victim restoration. Matches vssadmin/wmic
  shadow-copy deletion, wbadmin catalog/backup deletion, bcdedit recovery-disabling
  flags, and PowerShell WMI/CIM shadow-copy removal.

  False positives: legitimate backup software (Veeam, Azure Backup agent, Windows
  Server Backup scheduled jobs) resizing/pruning shadow storage as part of normal
  operation; admins intentionally disabling System Restore on VM templates during
  imaging. Exclude the known backup service accounts/processes.
severity: High
status: Available
enabled: true
queryFile: inhibit-system-recovery-shadow-copy-deletion.kql
queryFrequency: PT1H
queryPeriod: P1D
triggerOperator: gt
triggerThreshold: 0
suppressionEnabled: false
suppressionDuration: PT5H
tactics:
  - Impact
relevantTechniques:
  - T1490
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: Name
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: ProcessCommandLine
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AllEntities
eventGroupingSettings:
  aggregationKind: SingleAlert
